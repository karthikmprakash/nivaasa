name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck web
        run: npm run typecheck --workspace @mycommunity/web
      - name: Typecheck mobile
        run: npm run typecheck --workspace @mycommunity/mobile
      - name: UI regressions
        run: npm run test:ui --workspace @mycommunity/web
      - name: Build web
        run: npm run build --workspace @mycommunity/web
