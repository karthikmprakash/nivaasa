name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release and brand pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Zip the brand pack
        run: |
          zip -r "nivaasa-brand-${GITHUB_REF_NAME}.zip" brand \
            -x 'brand/animations/frames/*'
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: Nivaasa ${{ github.ref_name }}
          generate_release_notes: true
          files: nivaasa-brand-${{ github.ref_name }}.zip
      - name: Apply detailed release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"
          fi
