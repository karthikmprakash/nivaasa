name: Nivaasa
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Nivaasa:
    type: application
    platform: iOS
    sources:
      - path: Nivaasa
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nivaasa.community
        INFOPLIST_FILE: Nivaasa/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 3A567KLT3Y
        CODE_SIGN_STYLE: Automatic
        NIVAASA_API_URL: https://nivaasa.app
      configs:
        Debug:
          NIVAASA_API_URL: http://localhost:3100
  NivaasaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Nivaasa
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Nivaasa:
    build:
      targets:
        Nivaasa: all
    test:
      targets: [NivaasaUITests]
