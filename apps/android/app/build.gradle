plugins {
    id 'com.android.application' version '8.13.0'
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21'
}
android {
    namespace 'app.nivaasa.community'
    compileSdk 36
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'app.nivaasa.community'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
        buildConfigField 'String', 'API_URL', '"' + providers.gradleProperty('nivaasaApiUrl').getOrElse('https://nivaasa.app') + '"'
    }
    buildTypes { debug { buildConfigField 'String', 'API_URL', '"' + providers.gradleProperty('nivaasaApiUrl').getOrElse('http://10.0.2.2:3100') + '"' } }
    buildFeatures { compose true; buildConfig true }
}
dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.material:material-icons-core:1.6.0'
}
